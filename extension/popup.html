<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 220px; padding: 12px; font-family: system-ui; font-size: 13px; margin: 0; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  label { display: flex; align-items: center; gap: 6px; padding: 4px 0; cursor: pointer; }
  .status { margin-top: 8px; font-size: 11px; color: #666; }
  input[type="text"] { width: 100%; box-sizing: border-box; font-size: 11px; padding: 3px 4px; margin-top: 2px; }
  .field { margin-top: 6px; }
  .field-label { font-size: 11px; color: #444; }
</style>
</head>
<body>
<h3>CC Quota Fetcher</h3>
<label><input type="checkbox" id="deepseek" checked> DeepSeek</label>
<label><input type="checkbox" id="mimo" checked> MiMo</label>
<label><input type="checkbox" id="glm" checked> GLM (z.ai)</label>
<div class="field">
  <div class="field-label">DeepSeek API Key</div>
  <input type="text" id="ds-key" placeholder="sk-...">
</div>
<div class="field">
  <div class="field-label">GLM API Key (z.ai)</div>
  <input type="text" id="glm-key" placeholder="z.ai token (no Bearer prefix)">
</div>
<div class="status" id="status"></div>
<script src="popup.js"></script>
</body>
</html>
